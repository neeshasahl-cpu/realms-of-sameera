<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>The Realms of Sameera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Uncial+Antiqua&family=Fondamento:ital@0;1&family=Noto+Sans+Runic&display=swap">
<style>
/* Layout: a film-style prologue in darkness, then one ink-on-paper map framed by his name, filling the screen. Single deliberate look. */
:root{
  --night:#0d0a07; --desk:#1c140d;
  --paper:#e6cd9c; --paper-2:#d6b984; --ink:#2a1c10; --ink-soft:#5c4631; --rubric:#8b2a17; --glow:#e9d3a0;
  --f-title:"Fondamento",Georgia,serif;
  --f-label:"Fondamento",Georgia,serif;
  --f-fell:"Fondamento",Georgia,serif;
  --f-body:"EB Garamond",Garamond,Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--desk)}
body{background:radial-gradient(ellipse at 50% 40%,#2a1e14,var(--desk) 75%);color:var(--paper);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
a{color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* the map */
.mapframe{width:min(100%,calc((100vh - 70px) * 1680 / 1160));max-width:100%;overflow-x:auto;overflow-y:hidden;border-radius:2px;
  box-shadow:0 0 0 1px #000,0 30px 80px #000c;background:var(--paper);-webkit-overflow-scrolling:touch;flex:none}
.cam{overflow:hidden;min-width:1000px}
.mapframe svg{display:block;width:100%;height:auto}
.below{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 20px;font-family:var(--f-fell);font-style:italic;color:#b9a27a;font-size:15px;text-align:center}
.below button{all:unset;cursor:pointer;font-family:var(--f-label);font-style:normal;letter-spacing:.08em;color:var(--glow);border-bottom:1px solid #e9d3a066;padding:2px 0}
.below button:hover{color:#fff}
.below button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* reveal: realms are inked in one after another as the road reaches them */
.st{transition:opacity 1.6s ease}
.revealing .st{opacity:0}
.revealing .st.on{opacity:1}
#roadreveal{transition:stroke-dashoffset 10s cubic-bezier(.45,.05,.4,1)}
.cam svg{transform-origin:17% 52%;transition:transform 11s cubic-bezier(.5,0,.25,1)}
.revealing.zoomed svg{transform:scale(2.1)}

.lm{cursor:pointer}
.lm .ic{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.lm:hover .ic,.lm:focus-visible .ic{transform:scale(1.35)}
.lm:focus{outline:none}
.lm:focus-visible .halo,.lm:hover .halo{stroke:var(--rubric);stroke-opacity:1;stroke-width:2}
.lm .pip{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .45s ease .25s,transform .6s cubic-bezier(.3,1.6,.5,1) .25s}
.lm.found .pip{opacity:1;transform:none}
.lm .aura{transform-box:fill-box;transform-origin:center;animation:aura 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes aura{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.5;transform:scale(1.18)}}
.lm.found .halo{stroke:var(--rubric);stroke-opacity:.9;stroke-width:1.4}
.lm .halo.nodisc,.lm:hover .halo.nodisc,.lm.found .halo.nodisc{stroke:none}
.lm:focus-visible .halo.nodisc{stroke:var(--rubric);stroke-width:1.5;stroke-dasharray:3 3}
svg.filtering .lm.lit .halo.nodisc{stroke:var(--rubric);stroke-width:2;stroke-dasharray:3 3}
.lm .fl{transform-box:fill-box;transform-origin:50% 100%}
.lm.found .fl.fire{animation:flicker 1.1s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.94,1.08)}}
.lm .cp{transform-box:fill-box;transition:transform .9s cubic-bezier(.3,1.25,.45,1),opacity .7s ease}
.c-door{transform-origin:left center}.c-left,.c-right{transform-origin:bottom center}.c-rock,.c-lift,.c-sink{transform-origin:center}
.lm.found .c-door{transform:scaleX(.12)}
.c-fade{transition:opacity 1.2s ease}.lm.found .c-fade{opacity:0}
.lm.r-orthanc .pip{transform:translateY(12px) scaleY(.2);transform-origin:50% 100%}
.lm.r-orthanc.found .pip{transform:none;transition:opacity .4s ease .2s,transform 1.3s cubic-bezier(.3,1.3,.5,1) .2s}
.sway{transform-box:fill-box;transform-origin:50% 100%}
.lm.found .sway{animation:sway 2.8s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.c-launch{transform-origin:center}
.lm.found .c-launch{transform:translateY(-46px) scale(.6);opacity:0;transition:transform 1s cubic-bezier(.5,0,.8,.6),opacity .9s ease .2s}
.burst{transform-box:fill-box;transform-origin:center}
.lm.found .burst{animation:burst 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes burst{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.lm.found .tw{animation:pulse 1.2s ease-in-out infinite}
.eyeglow{animation:pulse 2.6s ease-in-out infinite}
.lm.r-rohan .pip{transform:translateY(26px) scaleY(.15);transform-origin:50% 100%}
.lm.r-rohan.found .pip{transform:none;transition:opacity .4s ease .2s,transform 1.4s cubic-bezier(.3,1.2,.5,1) .2s}
.spark{opacity:0}
.lm.found .spark{animation:spark 1.7s ease-out infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--sx,0px),-14px);opacity:0}}
.lm.found .lamp{animation:lamp 1.9s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes lamp{from{opacity:1}to{opacity:.6}}
.rays,.swirl{transform-box:fill-box;transform-origin:center}
.lm.found .rays{animation:spin 10s linear infinite}
.lm.found .swirl{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lm.found .pulse,.lm.found .inscr{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.wave{transform-box:fill-box;transform-origin:0% 50%}
.lm.found .wave{animation:wave 1.3s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes wave{from{transform:skewY(-5deg)}to{transform:skewY(4deg) scaleX(.93)}}
.lm.found .c-rock{transform:translate(24px,10px) rotate(140deg);opacity:0}
.c-cloud{transform-origin:center}
.lm.found .c-cloud{transform:translate(34px,-10px) scale(1.25);opacity:0;transition:transform 1.6s ease-out,opacity 1.3s ease}
.lm.found .fl.flap{animation:flap 1.5s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes flap{from{transform:scale(1,1) translateY(0)}to{transform:scale(1,.78) translateY(-1px)}}
.lm.found .c-lift{transform:translateY(-22px) rotate(-8deg);opacity:0}
.lm.found .c-left{transform:translateX(-12px) rotate(-16deg)}
.lm.found .c-right{transform:translateX(12px) rotate(16deg)}
.lm.found .c-sink{transform:translateY(12px) scale(.5);opacity:0}
.lm:not(.found) .cover{animation:shimmer 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.82}}
.lm.flash .pip{filter:drop-shadow(0 0 6px #c8792a)}
#lantern{pointer-events:none;transition:opacity .4s}
.found-bar{display:inline-flex;align-items:center;gap:10px;font-style:normal;color:var(--glow);font-family:var(--f-label)}
.found-bar .track{width:110px;height:5px;border-radius:3px;background:#e9d3a033;overflow:hidden}
.found-bar .fill{display:block;height:100%;background:var(--glow);width:0;transition:width .6s ease}
#toast{position:fixed;z-index:40;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-family:var(--f-fell);
  font-size:20px;padding:14px 26px;border-radius:2px;box-shadow:0 14px 40px #000c;text-align:center;max-width:calc(100vw - 32px);box-sizing:border-box;animation:unroll .4s ease-out}
#toast b{display:block;font-weight:400;font-size:28px;color:var(--rubric)}
svg.filtering .lm{opacity:.2}
svg.filtering .lm.lit{opacity:1}
svg.filtering .lm.lit .halo{stroke:var(--rubric);stroke-opacity:1;stroke-width:2.2}
.rlabel{cursor:pointer}
.rlabel:focus{outline:none}
.rlabel:hover text.big,.rlabel:focus-visible text.big{fill:var(--rubric)}
#tip{position:fixed;pointer-events:none;background:var(--paper);color:var(--ink);font-family:var(--f-fell);font-size:15px;line-height:1.3;padding:6px 10px;border-radius:2px;
  box-shadow:0 4px 14px #0008;max-width:280px;z-index:20}

/* paper card */
#card{position:fixed;z-index:30;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:min(420px,calc(100vw - 32px));box-sizing:border-box;max-height:calc(100% - 32px);overflow:auto;
  background:var(--paper);color:var(--ink);padding:26px 26px 22px;border-radius:2px;box-shadow:0 0 0 1px #0006,0 20px 50px #000c,inset 0 0 50px #9c7a4a44;animation:unroll .28s ease-out}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@media (max-width:640px){#card{top:auto;bottom:0;right:0;left:0;width:auto;max-height:70%;border-radius:10px 10px 0 0;
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
#card .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:28px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:4px 8px;font-family:var(--f-body)}
#card .realm{font-family:var(--f-label);letter-spacing:.12em;font-size:14px;color:var(--rubric);margin:0 0 6px}
#card h2{font-family:var(--f-fell);font-weight:400;font-size:25px;line-height:1.18;margin:0 0 10px;text-wrap:balance;padding-right:20px}
#card .meta{font-family:var(--f-label);font-size:15px;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 12px;font-variant-numeric:tabular-nums}
#card .authors{font-size:16px;margin:0 0 14px;color:var(--ink-soft)}
#card .authors b{color:var(--ink);font-weight:600}
#card .ab{font-size:17px;margin:0 0 16px;padding-left:14px;border-left:2px solid var(--paper-2)}
#card .ab::before{content:"From the paper";display:block;font-family:var(--f-label);font-size:13px;letter-spacing:.1em;color:var(--ink-soft)}
#card .go{display:inline-block;font-family:var(--f-label);letter-spacing:.08em;background:var(--rubric);color:#f6e6cc;text-decoration:none;padding:8px 16px;border-radius:2px}
#card .go:hover{background:#a3361f}
#card ol{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:2px}
#card ol button{all:unset;cursor:pointer;display:block;padding:6px 0;border-bottom:1px dotted #b39a70;font-size:16px;line-height:1.3}
#card ol button:hover,#card ol button:focus-visible{color:var(--rubric)}
#card ol button span{font-family:var(--f-label);font-size:13px;color:var(--ink-soft);margin-right:8px;font-variant-numeric:tabular-nums}
#card .blurb{font-size:17px;margin:0 0 6px}

/* prologue */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 55%,#1d150d 0%,var(--night) 70%);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  transition:opacity 2.2s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000c 100%)}
#ember{position:absolute;left:50%;top:55%;width:60vmin;height:60vmin;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#c8792a33,transparent 65%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:translate(-50%,-50%) scale(1.12)}}
#lines{position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:24px}
.line{grid-area:1/1;max-width:30ch;text-align:center;font-family:var(--f-fell);font-style:italic;font-size:clamp(22px,3.6vw,40px);line-height:1.35;color:var(--glow);
  opacity:0;filter:blur(6px);transform:translateY(8px);transition:opacity 1.4s ease,filter 1.4s ease,transform 1.8s ease;text-wrap:balance;text-shadow:0 0 30px #c8792a55}
.line.show{opacity:1;filter:blur(0);transform:none}
.line.title{max-width:none;font-style:normal}
.line.title .t1{display:block;font-family:var(--f-label);font-size:clamp(14px,1.6vw,19px);letter-spacing:.5em;color:#b9a27a;margin-bottom:18px}
.line.title .t2{display:block;font-family:var(--f-title);font-size:clamp(40px,8vw,104px);line-height:1.05;color:#f1dfb4;letter-spacing:.02em}
.line.title .t3{display:block;font-family:var(--f-fell);font-style:italic;font-size:clamp(18px,2.4vw,28px);color:var(--glow);margin-top:20px}
.line .n{font-style:normal;font-family:var(--f-label);letter-spacing:.06em}
#skip{all:unset;position:absolute;z-index:2;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));cursor:pointer;
  font-family:var(--f-label);letter-spacing:.14em;font-size:14px;color:#a8916a;padding:8px 12px;border:1px solid #a8916a55;border-radius:2px}
#skip:hover{color:var(--glow);border-color:var(--glow)}
#skip:focus-visible{outline:2px solid var(--glow)}
@media (prefers-reduced-motion:reduce){.lm .pip,.lm .cp{transition:none}.lm:not(.found) .cover,.lm .aura,.lm .fl,.lm .c-cloud,.lm .spark,.lm .lamp,.lm .rays,.lm .swirl,.lm .pulse,.lm .inscr,.eyeglow,.lm .wave,.lm .sway,.lm .burst,.lm .tw{animation:none!important}#card{animation:none}.lm .ic,.st,#roadreveal,.cam svg,.line,#intro{transition:none}#ember{animation:none}}
</style>

<div id="intro" role="dialog" aria-label="Opening">
  <div id="ember"></div>
  <div id="lines"></div>
  <button id="skip">Skip to the map</button>
</div>

<div class="mapframe" id="mapframe"><div class="cam" id="cam"></div></div>
<div class="below"><span>Move your lantern over the map to uncover your work. Then click one to read it.</span>
  <span class="found-bar" aria-live="polite"><span id="foundtxt">0 found</span><span class="track"><span class="fill" id="foundfill"></span></span></span>
  <button id="revealall">Reveal all</button><button id="hideall">Hide them again</button><button id="replay">Play the opening again</button></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>
<aside id="card" hidden aria-live="polite"></aside>

<script>
const DATA = {"papers": [{"t": "Recognition of badminton strokes using dense trajectories", "y": 2014, "v": "ICIAfS", "a": ["Sameera Ramasinghe", "K. G. Manosha Chathuramali", "R. Rodrigo"], "c": 18, "ab": "", "u": "https://doi.org/10.1109/ICIAFS.2014.7069620", "r": "shire", "id": 0}, {"t": "Abnormal activity recognition using spatio-temporal features", "y": 2014, "v": "ICIAfS", "a": ["K. G. Manosha Chathuramali", "Sameera Ramasinghe", "R. Rodrigo"], "c": 7, "ab": "", "u": "https://doi.org/10.1109/ICIAFS.2014.7069592", "r": "shire", "id": 1}, {"t": "Action recognition by single stream convolutional neural networks: An approach using combined motion and static information", "y": 2015, "v": "ACPR", "a": ["Sameera Ramasinghe", "R. Rodrigo"], "c": 14, "ab": "", "u": "https://doi.org/10.1109/ACPR.2015.7486474", "r": "shire", "id": 2}, {"t": "Poster: Advanced Feature Based Deep Learning for Intelligent Human Activity Recognition: An Approach using Scene Context and Composition of Sub Events.", "y": 2016, "v": "MobiSys", "a": ["Sameera Ramasinghe"], "c": 1, "ab": "", "u": "https://doi.org/10.1145/2938559.2948813", "r": "shire", "id": 3}, {"t": "Micro Actions and Deep Static Features for Activity Recognition", "y": 2017, "v": "DICTA", "a": ["Sameera Ramasinghe", "Jathushan Rajasegaran", "Vinoj Jayasundara", "Kanchana Ranasinghe", "R. Rodrigo", "A. Pasqual"], "c": 0, "ab": "", "u": "https://doi.org/10.1109/DICTA.2017.8227463", "r": "shire", "id": 4}, {"t": "Combined Static and Motion Features for Deep-Networks-Based Activity Recognition in Videos", "y": 2018, "v": "IEEE TCSVT", "a": ["Sameera Ramasinghe", "Jathushan Rajasegaran", "Vinoj Jayasundara", "Kanchana Ranasinghe", "R. Rodrigo", "A. Pasqual"], "c": 13, "ab": "Activity recognition in videos in a deep-learning setting—or otherwise—uses both static and pre-computed motion components. The method of combining the two components, while keeping the burden on the deep network less, still remains uninvestigated.", "u": "https://arxiv.org/abs/1810.06827", "r": "shire", "id": 5}, {"t": "Volumetric Convolution: Automatic Representation Learning in Unit Ball", "y": 2018, "v": "arXiv", "a": ["Sameera Ramasinghe", "Salman Hameed Khan", "Nick Barnes"], "c": 5, "ab": "Convolution is an efficient technique to obtain abstract feature representations using hierarchical layers in deep networks.", "u": "https://arxiv.org/abs/1901.00616", "r": "mountains", "id": 6}, {"t": "A Context-aware Capsule Network for Multi-label Classification", "y": 2018, "v": "ECCV Workshops", "a": ["Sameera Ramasinghe", "C. D. Athuralya", "Salman Hameed Khan"], "c": 17, "ab": "Recently proposed Capsule Network is a brain inspired architecture that brings a new paradigm to deep learning by modelling input domain variations through vector based representations.", "u": "https://arxiv.org/abs/1810.06231", "r": "shire", "id": 7}, {"t": "Deep Semantic Segmentation for Built-up Area Extraction and Mapping from Satellite Imagery", "y": 2018, "v": "", "a": ["C. Athuraliya", "Sameera Ramasinghe", "Sriganesh Lokanathan"], "c": 0, "ab": "", "u": "https://www.semanticscholar.org/paper/f151584f0629df48dce56139b981e6e3f58b491d", "r": "shire", "id": 8}, {"t": "Blended Convolution and Synthesis for Efficient Discrimination of 3D Shapes", "y": 2019, "v": "WACV", "a": ["Sameera Ramasinghe", "Salman Hameed Khan", "Nick Barnes", "S. Gould"], "c": 4, "ab": "Existing models for shape analysis directly learn feature representations on 3D point clouds. We argue that 3D point clouds are highly redundant and hold irregular (permutation-invariant) structure, which makes it difficult to achieve inter-class discrimination efficiently.", "u": "https://arxiv.org/abs/1908.10209", "r": "mountains", "id": 9}, {"t": "Representation Learning on Unit Ball with 3D Roto-translational Equivariance", "y": 2019, "v": "IJCV", "a": ["Sameera Ramasinghe", "Salman Hameed Khan", "Nick Barnes", "S. Gould"], "c": 8, "ab": "Convolution is an integral operation that defines how the shape of one function is modified by another function. This powerful concept forms the basis of hierarchical feature learning in deep neural networks.", "u": "https://arxiv.org/abs/1912.01454", "r": "mountains", "id": 10}, {"t": "Spectral-GANs for High-Resolution 3D Point-cloud Generation", "y": 2019, "v": "IROS", "a": ["Sameera Ramasinghe", "Salman H. Khan", "Nick Barnes", "S. Gould"], "c": 47, "ab": "Point-clouds are a popular choice for robotics and computer vision tasks due to their accurate shape description and direct acquisition from range-scanners. This demands the ability to synthesize and reconstruct high-quality point-clouds.", "u": "https://arxiv.org/abs/1912.01800", "r": "mountains", "id": 11}, {"t": "Conditional Generative Modeling via Learning the Latent Space", "y": 2020, "v": "ICLR", "a": ["Sameera Ramasinghe", "Kanchana Ranasinghe", "Salman Hameed Khan", "Nick Barnes", "S. Gould"], "c": 10, "ab": "Although deep learning has achieved appealing results on several machine learning tasks, most of the models are deterministic at inference, limiting their application to single-modal settings.", "u": "https://arxiv.org/abs/2010.03132", "r": "eregion", "id": 12}, {"t": "Learned and Hand-crafted Feature Fusion in Unit Ball for 3D Object Classification", "y": 2020, "v": "ICPR", "a": ["Sameera Ramasinghe", "Salman Hameed Khan", "Nick Barnes"], "c": 0, "ab": ": Convolution is an effective technique that can be used to obtain abstract feature representations using hierarchical layers in deep networks. However, performing convolution in non-Euclidean topological spaces such as the unit ball ( B 3 ) is still an under-explored problem.", "u": "https://doi.org/10.5220/0009344801150125", "r": "mountains", "id": 13}, {"t": "Rethinking conditional GAN training: An approach using geometrically structured latent manifolds", "y": 2020, "v": "NeurIPS", "a": ["Sameera Ramasinghe", "M. Farazi", "Salman Hameed Khan", "Nick Barnes", "S. Gould"], "c": 11, "ab": "Conditional GANs (cGAN), in their rudimentary form, suffer from critical drawbacks such as the lack of diversity in generated outputs and distortion between the latent and output manifolds.", "u": "https://arxiv.org/abs/2011.13055", "r": "eregion", "id": 14}, {"t": "Synthesized Feature based Few-Shot Class-Incremental Learning on a Mixture of Subspaces", "y": 2021, "v": "CVPR", "a": ["Ali Cheraghian", "Shafin Rahman", "Sameera Ramasinghe", "Pengfei Fang", "Christian Simon", "L. Petersson", "Mehrtash Harandi"], "c": 85, "ab": "Few-shot class incremental learning (FSCIL) aims to incrementally add sets of novel classes to a well-trained base model in multiple training sessions with the restriction that only a few novel instances are available per class.", "u": "https://doi.org/10.1109/ICCV48922.2021.00854", "r": "rohan", "id": 15}, {"t": "Beyond Periodicity: Towards a Unifying Framework for Activations in Coordinate-MLPs", "y": 2021, "v": "CVPR", "a": ["Sameera Ramasinghe", "Simon Lucey"], "c": 200, "ab": "Coordinate-MLPs are emerging as an effective tool for modeling multidimensional continuous signals, overcoming many drawbacks associated with discrete grid-based approximations.", "u": "https://arxiv.org/abs/2111.15135", "r": "lorien", "id": 16}, {"t": "Enabling Equivariance for Arbitrary Lie Groups", "y": 2021, "v": "CVPR", "a": ["L. MacDonald", "Sameera Ramasinghe", "Simon Lucey"], "c": 33, "ab": "Although provably robust to translational perturbations, convolutional neural networks (CNNs) are known to suffer from extreme performance degradation when presented at test time with more general geometric transformations of inputs.", "u": "https://arxiv.org/abs/2111.08251", "r": "mountains", "id": 17}, {"t": "A Learnable Radial Basis Positional Embedding for Coordinate-MLPs", "y": 2021, "v": "AAAI", "a": ["Sameera Ramasinghe", "Simon Lucey"], "c": 12, "ab": "We propose a novel method to enhance the performance of coordinate-MLPs (also referred to as neural fields) by learning instance-specific positional embeddings. End-to-end optimization of positional embedding parameters along with network weights leads to poor generalization performance.", "u": "https://arxiv.org/abs/2112.11577", "r": "lorien", "id": 18}, {"t": "Robust normalizing flows using Bernstein-type polynomials", "y": 2021, "v": "BMVC", "a": ["Sameera Ramasinghe", "K. Fernando", "Salman Hameed Khan", "Nick Barnes"], "c": 11, "ab": "Modeling real-world distributions can often be challenging due to sample data that are subjected to perturbations, e.g., instrumentation errors, or added random noise. Since flow models are typically nonlinear algorithms, they amplify these initial errors, leading to poor generalizations.", "u": "https://arxiv.org/abs/2102.03509", "r": "eregion", "id": 19}, {"t": "Rethinking Positional Encoding", "y": 2021, "v": "arXiv", "a": ["J. Zheng", "Sameera Ramasinghe", "Simon Lucey"], "c": 73, "ab": "It is well noted that coordinate based MLPs benefit -- in terms of preserving high-frequency information -- through the encoding of coordinate positions as an array of Fourier features. Hitherto, the rationale for the effectiveness of these positional encodings has been solely studied through a Fourier lens.", "u": "https://arxiv.org/abs/2107.02561", "r": "lorien", "id": 20}, {"t": "Few-shot Class-incremental Learning for 3D Point Cloud Objects", "y": 2022, "v": "CVPR", "a": ["T. Chowdhury", "Ali Cheraghian", "Sameera Ramasinghe", "Sahar Ahmadi", "Morteza Saberi", "Shafin Rahman"], "c": 32, "ab": "Few-shot class-incremental learning (FSCIL) aims to incrementally fine-tune a model (trained on base classes) for a novel set of classes using a few examples without forgetting the previous training. Recent efforts address this problem primarily on 2D images.", "u": "https://arxiv.org/abs/2205.15225", "r": "rohan", "id": 21}, {"t": "On Regularizing Coordinate-MLPs", "y": 2022, "v": "arXiv", "a": ["Sameera Ramasinghe", "L. MacDonald", "Simon Lucey"], "c": 7, "ab": "We show that typical implicit regularization assumptions for deep neural networks (for regression) do not hold for coordinate-MLPs, a family of MLPs that are now ubiquitous in computer vision for representing high-frequency signals.", "u": "https://arxiv.org/abs/2202.00790", "r": "lorien", "id": 22}, {"t": "Trading Positional Complexity vs. Deepness in Coordinate Networks", "y": 2022, "v": "CVPR", "a": ["J. Zheng", "Sameera Ramasinghe", "Xueqian Li", "Simon Lucey"], "c": 27, "ab": "It is well noted that coordinate-based MLPs benefit -- in terms of preserving high-frequency information -- through the encoding of coordinate positions as an array of Fourier features. Hitherto, the rationale for the effectiveness of these positional encodings has been mainly studied through a Fourier lens.", "u": "https://arxiv.org/abs/2205.08987", "r": "lorien", "id": 23}, {"t": "Gaussian Activated Neural Radiance Fields for High Fidelity Reconstruction and Pose Estimation", "y": 2022, "v": "CVPR", "a": ["Shin-Fang Ch'ng", "Sameera Ramasinghe", "Jamie Sherrah", "Simon Lucey"], "c": 108, "ab": "Despite Neural Radiance Fields (NeRF) showing compelling results in photorealistic novel views synthesis of real-world scenes, most existing approaches require accurate prior camera poses.", "u": "https://arxiv.org/abs/2204.05735", "r": "lorien", "id": 24}, {"t": "On the Frequency-bias of Coordinate-MLPs", "y": 2022, "v": "NeurIPS", "a": ["Sameera Ramasinghe", "L. MacDonald", "Simon Lucey"], "c": 25, "ab": "We show that typical implicit regularization assumptions for deep neural networks (for regression) do not hold for coordinate-MLPs, a family of MLPs that are now ubiquitous in computer vision for representing high-frequency signals.", "u": "https://doi.org/10.52202/068431-0058", "r": "lorien", "id": 25}, {"t": "LumiNet: Perception-Driven Knowledge Distillation via Statistical Logit Calibration", "y": 2023, "v": "TMLR", "a": ["Md. Ismail Hossain", "M. M. Lutfe Elahi", "Sameera Ramasinghe", "Ali Cheraghian", "Fuad Rahman", "Nabeel Mohammed", "S. Rahman"], "c": 4, "ab": "In the knowledge distillation literature, feature-based methods have dominated due to their ability to effectively tap into extensive teacher models. In contrast, logit-based approaches, which aim to distill\"dark knowledge\"from teachers, typically exhibit inferior performance compared to feature-based methods.", "u": "https://arxiv.org/abs/2310.03669", "r": "orthanc", "id": 26}, {"t": "Curvature-Aware Training for Coordinate Networks", "y": 2023, "v": "CVPR", "a": ["Hemanth Saratchandran", "Shin-Fang Ch'ng", "Sameera Ramasinghe", "L. MacDonald", "Simon Lucey"], "c": 10, "ab": "Coordinate networks are widely used in computer vision due to their ability to represent signals as compressed, continuous entities. However, training these networks with first-order optimizers can be slow, hindering their use in real-time applications.", "u": "https://arxiv.org/abs/2305.08552", "r": "lorien", "id": 27}, {"t": "On the effectiveness of neural priors in modeling dynamical systems", "y": 2023, "v": "arXiv", "a": ["Sameera Ramasinghe", "Hemanth Saratchandran", "Violetta Shevchenko", "Simon Lucey"], "c": 4, "ab": "Modelling dynamical systems is an integral component for understanding the natural world. To this end, neural networks are becoming an increasingly popular candidate owing to their ability to learn complex functions from large amounts of data.", "u": "https://arxiv.org/abs/2303.05728", "r": "lorien", "id": 28}, {"t": "BLiRF: Bandlimited Radiance Fields for Dynamic Scene Modeling", "y": 2023, "v": "AAAI", "a": ["Sameera Ramasinghe", "Violetta Shevchenko", "Gil Avraham", "Anton van den Hengel"], "c": 11, "ab": "Inferring the 3D structure of a non-rigid dynamic scene from a single moving camera is an under-constrained problem. Inspired by the remarkable progress of neural radiance fields (NeRFs) in photo-realistic novel view synthesis of static scenes, it has also been extended to dynamic settings.", "u": "https://arxiv.org/abs/2302.13543", "r": "lorien", "id": 29}, {"t": "How much does Initialization Affect Generalization?", "y": 2023, "v": "ICML", "a": ["Sameera Ramasinghe", "L. MacDonald", "M. Farazi", "Hemanth Saratchandran", "Simon Lucey"], "c": 11, "ab": "", "u": "https://www.semanticscholar.org/paper/a9844d5afbfbf3d3b6aa799cf9e6d8189fa29f62", "r": "lorien", "id": 30}, {"t": "Robust Point Cloud Processing Through Positional Embedding", "y": 2023, "v": "3DV", "a": ["J. Zheng", "Xueqian Li", "Sameera Ramasinghe", "Simon Lucey"], "c": 8, "ab": "End-to-end trained per-point embeddings are an essential ingredient of any state-of-the-art 3D point cloud processing such as detection or alignment. Methods like PointNet [17], or the more recent point cloud transformer [7]—and its variants—all employ learned per-point embeddings.", "u": "https://arxiv.org/abs/2309.00339", "r": "mountains", "id": 31}, {"t": "Canonical Shape Projection Is All You Need for 3D Few-Shot Class Incremental Learning", "y": 2024, "v": "CVPR", "a": ["Ali Cheraghian", "Zeeshan Hayder", "Sameera Ramasinghe", "S. Rahman", "Javad Jafaryahya", "Lars Petersson", "Mehrtash Harandi"], "c": 8, "ab": "", "u": "https://doi.org/10.1007/978-3-031-72940-9_3", "r": "rohan", "id": 32}, {"t": "Neural Experts: Mixture of Experts for Implicit Neural Representations", "y": 2024, "v": "NeurIPS", "a": ["Yizhak Ben-Shabat", "Chamin Pasidu Hewa Koneputugodage", "Sameera Ramasinghe", "Stephen Gould"], "c": 14, "ab": "Implicit neural representations (INRs) have proven effective in various tasks including image, shape, audio, and video reconstruction. These INRs typically learn the implicit field from sampled input points.", "u": "https://arxiv.org/abs/2410.21643", "r": "lorien", "id": 33}, {"t": "ViewFusion: Towards Multi-View Consistency via Interpolated Denoising", "y": 2024, "v": "CVPR", "a": ["Xiang-Hui Yang", "Yan Zuo", "Sameera Ramasinghe", "Loris Bazzani", "Gil Avraham", "Anton van den Hengel"], "c": 22, "ab": "Novel-view synthesis through diffusion models has demonstrated remarkable potential for generating diverse and high-quality images. Yet, the independent process of image generation in these prevailing methods leads to challenges in maintaining multiple view consistency.", "u": "https://arxiv.org/abs/2402.18842", "r": "eregion", "id": 34}, {"t": "Improving the Convergence of Dynamic NeRFs via Optimal Transport", "y": 2024, "v": "ICLR", "a": ["Sameera Ramasinghe", "Violetta Shevchenko", "Gil Avraham", "Hisham Husain", "Anton van den Hengel"], "c": 5, "ab": "", "u": "https://www.semanticscholar.org/paper/17d034534ee4d8c364b7801819e6a20f1947e15a", "r": "lorien", "id": 35}, {"t": "A Sampling Theory Perspective on Activations for Implicit Neural Representations", "y": 2024, "v": "ICML", "a": ["Hemanth Saratchandran", "Sameera Ramasinghe", "Violetta Shevchenko", "Alexander Long", "Simon Lucey"], "c": 29, "ab": "Implicit Neural Representations (INRs) have gained popularity for encoding signals as compact, differentiable entities.", "u": "https://arxiv.org/abs/2402.05427", "r": "lorien", "id": 36}, {"t": "From Activation to Initialization: Scaling Insights for Optimizing Neural Fields", "y": 2024, "v": "CVPR", "a": ["Hemanth Saratchandran", "Sameera Ramasinghe", "Simon Lucey"], "c": 12, "ab": "In the realm of computer vision, Neural Fields have gained prominence as a contemporary tool harnessing neural networks for signal representation. Despite the remarkable progress in adapting these networks to solve a variety of problems, the field still lacks a comprehensive theoretical framework.", "u": "https://arxiv.org/abs/2403.19205", "r": "lorien", "id": 37}, {"t": "Learning Visual Hierarchies in Hyperbolic Space for Image Retrieval", "y": 2024, "v": "CVPR", "a": ["Ziwei Wang", "Sameera Ramasinghe", "Chen-Chen Hu", "Julien Monteil", "Loris Bazzani", "Thalaiyasingam Ajanthan"], "c": 14, "ab": "Structuring latent representations in a hierarchical manner enables models to learn patterns at multiple levels of abstraction. However, most prevalent image understanding models focus on visual similarity, and learning visual hierarchies is relatively unexplored.", "u": "https://arxiv.org/abs/2411.17490", "r": "orthanc", "id": 38}, {"t": "Accept the Modality Gap: An Exploration in the Hyperbolic Space", "y": 2024, "v": "CVPR", "a": ["Sameera Ramasinghe", "Violetta Shevchenko", "Gil Avraham", "Thalaiyasingam Ajanthan"], "c": 53, "ab": "", "u": "https://doi.org/10.1109/CVPR52733.2024.02574", "r": "orthanc", "id": 39}, {"t": "Test-Time Adaptation of 3D Point Clouds via Denoising Diffusion Models", "y": 2024, "v": "WACV", "a": ["Hamidreza Dastmalchi", "Aijun An", "Ali Cheraghian", "S. Rahman", "Sameera Ramasinghe"], "c": 11, "ab": "Test-time adaptation (TTA) of 3D point clouds is crucial for mitigating discrepancies between training and testing samples in real-world scenarios, particularly when handling corrupted point clouds. LiDAR data, for instance, can be affected by sensor failures or environmental factors, causing domain gaps.", "u": "https://arxiv.org/abs/2411.14495", "r": "mountains", "id": 40}, {"t": "Backpropagation-free Network for 3D Test-time Adaptation", "y": 2024, "v": "CVPR", "a": ["Yan-Shuo Wang", "Ali Cheraghian", "Zeeshan Hayder", "Jie Hong", "Sameera Ramasinghe", "S. Rahman", "David Ahmedt-Aristizabal", "Xuesong Li", "Lars Petersson", "Mehrtash Harandi"], "c": 19, "ab": "Real-world systems often encounter new data over time, which leads to experiencing target domain shifts. Existing Test- Time Adaptation (TTA) methods tend to apply computationally heavy and memory-intensive backpropagation-based approaches to handle this.", "u": "https://arxiv.org/abs/2403.18442", "r": "mountains", "id": 41}, {"t": "VI3NR: Variance Informed Initialization for Implicit Neural Representations", "y": 2025, "v": "CVPR", "a": ["Chamin Pasidu Hewa Koneputugodage", "Yizhak Ben-Shabat", "Sameera Ramasinghe", "Stephen Gould"], "c": 1, "ab": "Implicit Neural Representations (INRs) are a versatile and powerful tool for encoding various forms of data, including images, videos, sound, and 3D shapes. A critical factor in the success of INRs is the initialization of the network, which can significantly impact the convergence and accuracy of the learned model.", "u": "https://arxiv.org/abs/2504.19270", "r": "lorien", "id": 42}, {"t": "Mixtures of Subspaces for Bandwidth Efficient Context Parallel Training", "y": 2025, "v": "NeurIPS", "a": ["Sameera Ramasinghe", "Thalaiyasingam Ajanthan", "H. M. Dolatabadi", "Gil Avraham", "Violetta Shevchenko", "Yan Zuo", "C. H. Koneputugodage", "Alexander Long"], "c": 2, "ab": "Pretraining language models with extended context windows enhances their ability to leverage rich information during generation. Existing methods split input sequences into chunks, broadcast them across multiple devices, and compute attention block by block which incurs significant communication overhead.", "u": "https://doi.org/10.52202/085713-2421", "r": "gondor", "id": 43}, {"t": "Subspace Networks: Scaling Decentralized Training with Communication-Efficient Model Parallelism", "y": 2025, "v": "NeurIPS", "a": ["Sameera Ramasinghe", "Thalaiyasingam Ajanthan", "Gil Avraham", "Yan Zuo", "Alexander Long"], "c": 12, "ab": "Scaling models has led to significant advancements in deep learning, but training these models in decentralized settings remains challenging due to communication bottlenecks. While existing compression techniques are effective in data-parallel, they do not extend to model parallelism.", "u": "https://arxiv.org/abs/2506.01260", "r": "gondor", "id": 44}, {"t": "QID: Efficient Query-Informed ViTs in Data-Scarce Regimes for OCR-Free Visual Document Understanding", "y": 2025, "v": "CVPR", "a": ["B. M. Le", "Shao-Yuan Xu", "Jinmiao Fu", "Zhi-Sheng Huang", "Moyan Li", "Yanhui Guo", "Hongdong Li", "Sameera Ramasinghe", "Bryan Wang"], "c": 0, "ab": "In Visual Document Understanding (VDU) tasks, finetuning a pre-trained Vision-Language Model (VLM) with new datasets often falls short in optimizing the vision encoder to identify query-specific regions in text-rich document images.", "u": "https://arxiv.org/abs/2504.02971", "r": "orthanc", "id": 45}, {"t": "DARB-Splatting: Generalizing Splatting with Decaying Anisotropic Radial Basis Functions", "y": 2025, "v": "WACV", "a": ["Hashiru Pramuditha", "Vinasirajan Viruthshaan", "Vishagar Arunan", "Saeedha Nazar", "Sameera Ramasinghe", "Simon Lucey", "Ranga Rodrigo"], "c": 5, "ab": "Splatting-based 3D reconstruction methods have gained popularity with the advent of 3D Gaussian Splatting, efficiently synthesizing high-quality novel views.", "u": "https://arxiv.org/abs/2501.12369", "r": "lorien", "id": 46}, {"t": "Nesterov Method for Asynchronous Pipeline Parallel Optimization", "y": 2025, "v": "ICML", "a": ["Thalaiyasingam Ajanthan", "Sameera Ramasinghe", "Yan Zuo", "Gil Avraham", "Alexander Long"], "c": 8, "ab": "Pipeline Parallelism (PP) enables large neural network training on small, interconnected devices by splitting the model into multiple stages. To maximize pipeline utilization, asynchronous optimization is appealing as it offers 100% pipeline utilization by construction.", "u": "https://arxiv.org/abs/2505.01099", "r": "gondor", "id": 47}, {"t": "Scaling Prompt Instructed Zero Shot Composed Image Retrieval with Image-Only Data", "y": 2025, "v": "IJCNN", "a": ["Yiqun Duan", "Sameera Ramasinghe", "Stephen Gould", "Ajanthan Thalaiyasingam"], "c": 4, "ab": "Composed Image Retrieval (CIR) is the task of retrieving images matching a reference image augmented with a text, where the text describes changes to the reference image in natural language. Traditionally, models designed for CIR have relied on triplet data containing a reference image, reformulation text, and a target image.", "u": "https://arxiv.org/abs/2504.00812", "r": "orthanc", "id": 48}, {"t": "Momentum Look-Ahead for Asynchronous Distributed Low-Communication Training", "y": null, "v": "", "a": ["Thalaiyasingam Ajanthan", "Sameera Ramasinghe", "Gil Avraham", "Yan Zuo", "Alexander Long"], "c": 0, "ab": "", "u": "https://www.semanticscholar.org/paper/0de9221bd1f535733c3bcdade13a0a39a73a26c8", "r": "gondor", "id": 49}, {"t": "Beyond Top-K: Structured Sparsification for Compression in Pipeline Parallel", "y": null, "v": "", "a": ["Sameera Ramasinghe", "Thalaiyasingam Ajanthan", "Gil Avraham", "Yan Zuo", "Alexander Long"], "c": 0, "ab": "", "u": "https://www.semanticscholar.org/paper/e4e825cab3f7f0d940e22582cfc32ae50b1d6a3e", "r": "gondor", "id": 50}, {"t": "Exploring Asynchronism in Swarm Parallelism", "y": null, "v": "", "a": ["Yan Zuo", "Gil Avraham", "Thalaiyasingam Ajanthan", "Sameera Ramasinghe", "Alexander Long"], "c": 0, "ab": "", "u": "https://www.semanticscholar.org/paper/f9e276d68cfd2547ec6454e3adbd530aa54e8865", "r": "gondor", "id": 51}, {"t": "AsyncMesh: Fully Asynchronous Optimization for Data and Pipeline Parallelism", "y": 2026, "v": "arXiv", "a": ["Thalaiyasingam Ajanthan", "Sameera Ramasinghe", "Gil Avraham", "H. M. Dolatabadi", "C. H. Koneputugodage", "Violetta Shevchenko", "Yan Zuo", "Alexander Long"], "c": 2, "ab": "Data and pipeline parallelism are key strategies for scaling neural network training across distributed devices, but their high communication cost necessitates co-located computing clusters with fast interconnects, limiting their scalability.", "u": "https://arxiv.org/abs/2601.22442", "r": "gondor", "id": 52}, {"t": "SENTINEL: Stagewise Integrity Verification for Pipeline Parallel Decentralized Training", "y": 2026, "v": "arXiv", "a": ["H. M. Dolatabadi", "Thalaiyasingam Ajanthan", "Sameera Ramasinghe", "C. H. Koneputugodage", "Gil Avraham", "Yan Zuo", "Violetta Shevchenko", "Alexander Long"], "c": 0, "ab": "Decentralized training introduces critical security risks when executed across untrusted, geographically distributed nodes. While existing Byzantine-tolerant literature addresses data parallel (D // ---------- the illustrator's hand: detailed versions of every drawing ----------
const G=(x,y,inner,sc=1)=>`<g transform="translate(${f(x)},${f(y)})${sc!==1?` scale(${sc})`:""}">${inner}</g>`;
const fillP=(d,w=1.2,fill=PAPER)=>`<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
const solid=(d,c=INK,op=1)=>`<path d="${d}" fill="${c}" fill-opacity="${op}"/>`;

// a mountain: outline, black right flank, ridge, slope hatching, snow line and foothills
function peak(x,y,s,shade=true){
  const h=s*1.3,tx=x+J(s*.15),ty=y-h;
  let o=fillP(`M${f(x-s)},${f(y)} Q${f(x-s*.45)},${f(y-h*.5)} ${f(tx)},${f(ty)} Q${f(x+s*.4)},${f(y-h*.55)} ${f(x+s)},${f(y)}`,1.35);
  if(shade)o+=solid(`M${f(tx)},${f(ty)} Q${f(x+s*.4)},${f(y-h*.55)} ${f(x+s)},${f(y)} L${f(x+s*.3)},${f(y)} L${f(x+s*.38+J(3))},${f(y-h*.2)} L${f(x+s*.14)},${f(y-h*.36)} L${f(x+s*.26+J(3))},${f(y-h*.55)} L${f(x+s*.06)},${f(y-h*.7)} L${f(x+s*.12)},${f(y-h*.84)} Z`,INK,.84);
  o+=pen(`M${f(tx)},${f(ty)} Q${f(tx-s*.2)},${f(y-h*.45)} ${f(x-s*.32)},${f(y)}`,.8);
  for(let k=0;k<6;k++){const u=.18+k*.12,px=tx-(tx-(x-s))*u,py=ty+(y-ty)*u;o+=pen(`M${f(px+2)},${f(py+1)} l${f(s*.2)},${f(s*.16)}`,.55,SOFT)}
  for(let k=0;k<3;k++){const u=.35+k*.18,px=tx-(tx-(x-s*.32))*u,py=ty+(y-ty)*u;o+=pen(`M${f(px+2)},${f(py)} l${f(s*.16)},${f(s*.1)}`,.5,SOFT)}
  o+=pen(`M${f(tx-s*.22)},${f(ty+h*.26)} l${f(s*.08)},${f(-h*.07)} l${f(s*.07)},${f(h*.08)} l${f(s*.08)},${f(-h*.06)}`,.65);
  o+=pen(`M${f(x-s-5)},${f(y+1)} q${f(s*.3)},-4 ${f(s*.6)},0 M${f(x+s*.5)},${f(y+1)} q${f(s*.4)},-4 ${f(s*.8)},0`,.7,SOFT);
  return o;
}
// a mallorn of Lórien: tall silver trunk, tiered golden crown, elven light about it
function scallop(cx,cy,rx,ry,n,fill,w=1){const pts=[];for(let i=0;i<n;i++){const a=Math.PI+i/(n-1)*Math.PI;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}
  let d=`M${f(cx-rx)},${f(cy+ry*.35)} L${f(pts[0][0])},${f(pts[0][1])}`;
  for(let i=0;i<n-1;i++){const a=pts[i],b=pts[i+1],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;d+=` Q${f(cx+(mx-cx)*1.32)},${f(cy+(my-cy)*1.32)} ${f(b[0])},${f(b[1])}`}
  d+=` L${f(cx+rx)},${f(cy+ry*.35)} Q${f(cx)},${f(cy+ry*.75)} ${f(cx-rx)},${f(cy+ry*.35)} Z`;
  return `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`}
function mallorn(x,y,s){
  const H=s*2.1,top=y-H,w=s*.62;
  let o=`<ellipse cx="${f(x)}" cy="${f(y-H*.58)}" rx="${f(w*1.9)}" ry="${f(H*.62)}" fill="url(#holy)"/>`;
  o+=`<path d="M${f(x-s*.11)},${f(y)} Q${f(x-s*.05)},${f(y-H*.3)} ${f(x-s*.03)},${f(y-H*.55)} L${f(x+s*.03)},${f(y-H*.55)} Q${f(x+s*.05)},${f(y-H*.3)} ${f(x+s*.11)},${f(y)} Z" fill="#f7f2e4" stroke="${INK}" stroke-width=".8"/>`;
  o+=pen(`M${f(x-s*.11)},${f(y)} q${f(-s*.12)},${f(s*.04)} ${f(-s*.22)},${f(s*.08)} M${f(x+s*.11)},${f(y)} q${f(s*.12)},${f(s*.04)} ${f(s*.22)},${f(s*.08)}`,.6);
  o+=pen(`M${f(x)},${f(y-H*.32)} q${f(-w*.4)},${f(-H*.08)} ${f(-w*.75)},${f(-H*.2)} M${f(x)},${f(y-H*.4)} q${f(w*.4)},${f(-H*.08)} ${f(w*.7)},${f(-H*.22)}`,.7);
  o+=scallop(x,y-H*.42,w*1.05,H*.12,6,"#e9c96e",.9)+scallop(x,y-H*.6,w*.85,H*.12,5,"#efd486",.9)+scallop(x,y-H*.77,w*.6,H*.11,4,"#f6e3a6",.9);
  o+=pen(`M${f(x-w*.5)},${f(y-H*.44)} q${f(w*.2)},${f(-H*.04)} ${f(w*.4)},0 M${f(x+w*.1)},${f(y-H*.62)} q${f(w*.2)},${f(-H*.04)} ${f(w*.4)},0`,.45,SOFT);
  const star=(sx,sy,r)=>`<path d="M${f(sx)},${f(sy-r)} L${f(sx+r*.28)},${f(sy-r*.28)} L${f(sx+r)},${f(sy)} L${f(sx+r*.28)},${f(sy+r*.28)} L${f(sx)},${f(sy+r)} L${f(sx-r*.28)},${f(sy+r*.28)} L${f(sx-r)},${f(sy)} L${f(sx-r*.28)},${f(sy-r*.28)} Z" fill="#fffbea" stroke="#c9a14a" stroke-width=".3"/>`;
  o+=star(x-w*.55,y-H*.5,s*.11)+star(x+w*.45,y-H*.68,s*.09)+star(x+w*.05,y-H*.88,s*.12);
  o+=pen(`M${f(x-w*.75)},${f(y-H*.52)} v${f(s*.14)} M${f(x+w*.7)},${f(y-H*.62)} v${f(s*.12)}`,.4);
  o+=`<circle cx="${f(x-w*.75)}" cy="${f(y-H*.52+s*.18)}" r="${f(s*.06)}" fill="#fff1b8" stroke="#c9a14a" stroke-width=".3"/><circle cx="${f(x+w*.7)}" cy="${f(y-H*.62+s*.16)}" r="${f(s*.055)}" fill="#fff1b8" stroke="#c9a14a" stroke-width=".3"/>`;
  return o+pen(`M${f(x-s*.35)},${f(y+.5)} h${f(s*.7)}`,.6,SOFT);
}
// trees: scalloped broadleaf, layered pine, or a tall golden mallorn
function tree(x,y,s,stip=1,kind="oak"){
  let o="";
  if(kind==="pine"){
    const H=s*1.7;o+=pen(`M${f(x)},${f(y)} v${f(-H*.25)}`,1.2);
    for(let i=0;i<4;i++){const by=y-s*.18-i*H*.19,w=s*(.62-i*.13),th=H*.3;let d=`M${f(x-w)},${f(by)} L${f(x)},${f(by-th)} L${f(x+w)},${f(by)}`;
      for(let j=1;j<=6;j++)d+=` L${f(x+w-j*w/3)},${f(by+(j%2?-2.2:0))}`;o+=fillP(d+"Z",1);
      o+=pen(`M${f(x+1)},${f(by-th*.75)} L${f(x+w*.75)},${f(by-1)} M${f(x+w*.25)},${f(by-th*.3)} l${f(w*.2)},${f(th*.2)}`,.55)}
    return o;
  }
  if(kind==="mallorn")return mallorn(x,y,s);
  const M=false,cr=s*.55,cy=y-s*.78;
  o+=fillP(`M${f(x-s*.1)},${f(y)} Q${f(x-s*.04)},${f((y+cy)/2)} ${f(x-s*.05)},${f(cy+cr*.35)} L${f(x+s*.05)},${f(cy+cr*.35)} Q${f(x+s*.04)},${f((y+cy)/2)} ${f(x+s*.1)},${f(y)} Z`,.9,M?"#f2e6c8":PAPER);
  if(M)o+=pen(`M${f(x)},${f(cy+cr*.6)} l${f(-s*.25)},${f(-s*.3)} M${f(x)},${f(cy+cr*.7)} l${f(s*.28)},${f(-s*.32)}`,.8);
  const n=7,pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i/n*Math.PI*2+J(.3);pts.push([x+Math.cos(a)*cr,cy+Math.sin(a)*cr*.82])}
  let d=`M${f(pts[0][0])},${f(pts[0][1])}`;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,k=1.38;d+=` Q${f(x+(mx-x)*k)},${f(cy+(my-cy)*k)} ${f(b[0])},${f(b[1])}`}
  o+=fillP(d+"Z",1.05,M?"#ecd08a":PAPER);
  o+=pen(`M${f(x-cr*.45)},${f(cy-cr*.05)} q${f(cr*.2)},${f(-cr*.3)} ${f(cr*.45)},${f(-cr*.1)} M${f(x+cr*.05)},${f(cy+cr*.3)} q${f(cr*.25)},${f(-cr*.25)} ${f(cr*.45)},0`,.6);
  for(let i=0;i<4;i++)o+=pen(`M${f(x+cr*(.25+i*.15))},${f(cy+cr*(.05+i*.1))} l${f(-cr*.12)},${f(cr*.2)}`,.55);
  for(let i=0;i<stip;i++)o+=`<circle cx="${f(x+J(cr))}" cy="${f(cy+J(cr*.8))}" r=".75" fill="${INK}"/>`;
  o+=pen(`M${f(x-s*.3)},${f(y+.5)} h${f(s*.6)}`,.6,SOFT);
  return o;
}
function forest(cx,cy,rx,ry,n,s,stip,kind="oak"){const pts=[];for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}
  return pts.sort((a,b)=>a[1]-b[1]).map(p=>tree(p[0],p[1],s*(.8+rnd()*.4),stip,kind)).join("")}
function hills(cx,cy,rx,ry,n){let o="";for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());const x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*r,w=10+rnd()*9;
  o+=pen(`M${f(x-w)},${f(y)} Q${f(x-w*.2)},${f(y-w*1.15)} ${f(x+w)},${f(y)}`,1,INK);
  for(let k=0;k<3;k++)o+=pen(`M${f(x+w*(.15+k*.22))},${f(y-w*(.42-k*.12))} l${f(w*.12)},${f(w*.24)}`,.6,SOFT);
  o+=pen(`M${f(x-w-2)},${f(y)} l-1.5,-4 M${f(x-w+1)},${f(y)} l0,-5`,.6,SOFT)}return o}

  +pen(`M${f(x-w*.2)},${f(y-h-w*.25)} l${f(w*.9)},${f(w*.5)} M${f(x-w*.6)},${f(y-h-w*.1)} l${f(w*.9)},${f(w*.5)}`,.45)+solid(`M${f(x-1.5)},${f(y)} v-3.5 h3 v3.5 z`)};

  const roadD=smooth(ROAD);

  let s=`<svg viewBox="-40 -120 1680 1160" xmlns="http://www.w3.org/2000/svg" id="map" role="img" aria-label="Ink map of Sameera's research, with one landmark per paper">

    <radialGradient id="hearth"><stop offset="0" stop-color="#fff0c0"/><stop offset=".45" stop-color="#f0b45a"/><stop offset="1" stop-color="#6e3a14"/></radialGradient>

    <radialGradient id="lanternglow"><stop offset="0" stop-color="#fff3c4" stop-opacity=".75"/><stop offset=".5" stop-color="#f2c86a" stop-opacity=".25"/><stop offset="1" stop-color="#f2c86a" stop-opacity="0"/></radialGradient>

    <mask id="roadmask" maskUnits="userSpaceOnUse" x="-40" y="-120" width="1680" height="1160"><path id="roadreveal" d="${roadD}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></mask>
    ${Object.entries(ICONS).map(([k,v])=>`<g id="i-${k}">${v}</g>`).join("")}

  <circle id="lantern" cx="-200" cy="-200" r="90" fill="url(#lanternglow)" opacity="0"/>`;

  // the land itself
  s+=`<g class="st" data-st="base">`;
  [0,7,14,22,31,41].forEach((o,i)=>{s+=`<path d="${coastLine}" transform="translate(${-o},0)" fill="none" stroke="${i?SOFT:INK}" stroke-width="${i?.8:1.7}" stroke-opacity="${i?(.75-i*.12).toFixed(2):1}"/>`});

  s+=`<path d="${river}" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="${river}" fill="none" stroke="${PAPER}" stroke-width="9.4" stroke-linecap="round"/><path d="${river}" fill="none" stroke="${SOFT}" stroke-width=".7" stroke-dasharray="5 11"/>`;

  s+=small(28,520,"The Great Sea",20,-90)+small(1124,350,"Anduin",16,72);
  s+=extras()+fillers();
  s+=`<g transform="translate(210,855)">${pen("M0,-72 V72 M-72,0 H72",1.4)}
    <path d="M0,-80 l-6,14 l6,-4 l6,4 z M0,80 l-6,-14 l6,4 l6,-4 z M80,0 l-14,-6 l4,6 l-4,6 z M-80,0 l14,-6 l-4,6 l4,6 z" fill="${INK}"/>
    <circle r="7" fill="${PAPER}" stroke="${INK}" stroke-width="1.2"/><circle r="2" fill="${INK}"/>
    ${pen("M-22,-22 L22,22 M22,-22 L-22,22",.6,SOFT)}
    ${runeText(0,-88,"n",22,INK)}${runeText(0,108,"s",22,INK)}${runeText(96,8,"e",22,INK)}${runeText(-96,8,"w",22,INK)}</g>`;
  s+=`</g>`;

  // the road, inked as he travels it
  s+=`<g mask="url(#roadmask)"><path d="${roadD}" fill="none" stroke="${RUB}" stroke-width="2.3" stroke-dasharray="7 6" stroke-linecap="round"/></g>`;

  // each realm: scenery, label, milestone, landmarks
  const MS={shire:[338,592,"2014"],mountains:[588,412,"2018"],eregion:[505,575,"2020"],lorien:[836,478,"2021"],orthanc:[772,692,"2023"],gondor:[1102,848,"2025"]};
  for(const [k] of ORDER){
    s+=`<g class="st" data-st="${k}">${deco[k]}${rlabel(k)}`;
    if(MS[k])s+=milestone(...MS[k]);

  }

  // the frame with his name, enclosing the whole map
  const corner=(x,y,sx,sy)=>`<path transform="translate(${x},${y}) scale(${sx},${sy})" d="M0,0 h34 M0,0 v34 M6,6 h20 M6,6 v20 M6,6 l14,14" stroke="${INK}" stroke-width="1.3" fill="none"/><circle cx="${x+sx*20}" cy="${y+sy*20}" r="2.4" fill="${RUB}"/>`;
  s+=`<g class="st" data-st="frame">
    <rect x="-24" y="-104" width="1648" height="1128" fill="none" stroke="${INK}" stroke-width="3"/>
    <rect x="-16" y="-96" width="1632" height="1112" fill="none" stroke="${INK}" stroke-width=".9"/>
    ${corner(-16,-96,1,1)}${corner(1616,-96,-1,1)}${corner(-16,1016,1,-1)}${corner(1616,1016,-1,-1)}
    <path d="M-16,0 H1616" stroke="${INK}" stroke-width="1.2"/><path d="M-16,5 H1616" stroke="${INK}" stroke-width=".5"/>
    <text x="800" y="-27" text-anchor="middle" font-family="Fondamento,serif" font-size="64" fill="${INK}">The Realms of Sameera</text>
    ${runeText(300,-40,"happy birthday",24)}${runeText(1300,-40,"the road goes ever on",22)}
    
  </g>`;
  s+=`<rect x="-40" y="-120" width="1680" height="1160" fill="url(#burn)" pointer-events="none"/></svg>`;

const cam=document.getElementById("cam");cam.innerHTML=buildMap();
const svg=document.getElementById("map"),tip=document.getElementById("tip"),card=document.getElementById("card");
const authorsHTML=a=>a.map(n=>n===ME?`<b>${esc(n)}</b>`:esc(n)).join(", ");
let lastFocus=null;
function openPaper(id){discover(id,true);const p=P[id],R=REALMS[p.r];if(card.hidden)lastFocus=document.activeElement;
  card.innerHTML=`<button class="x" aria-label="Close">×</button><p class="realm">${p.spot==="argonath"?"The Argonath":p.spot==="book"?"Rivendell":esc(R.name)}</p><h2>${esc(p.t)}</h2>
   <p class="meta">${p.y||"Undated"}${p.v?" · "+esc(p.v):""}${p.c?` · cited ${p.c} time${p.c===1?"":"s"}`:""}</p>
   <p class="authors">${authorsHTML(p.a)}</p>${p.ab?`<p class="ab">${esc(p.ab)}</p>`:`<p class="blurb">${esc(p.note||R.blurb)}</p>`}
   ${p.u?`<a class="go" href="${esc(p.u)}" target="_blank" rel="noopener">Read the paper</a>`:""}`;
  show();}
function openRealm(k){const R=REALMS[k],list=by(k);if(card.hidden)lastFocus=document.activeElement;
  card.innerHTML=`<button class="x" aria-label="Close">×</button><p class="realm">${esc(R.yrs)} · ${list.length} papers</p><h2>${esc(R.name)}</h2><p class="blurb">${esc(R.blurb)}</p>
   <ol>${list.map(p=>`<li><button data-id="${p.id}"><span>${p.y||"—"}</span>${esc(p.t)}</button></li>`).join("")}</ol>`;
  card.querySelectorAll("ol button").forEach(b=>b.onclick=()=>openPaper(+b.dataset.id));
  show();setFilter(p=>p.r===k);}
function show(){card.hidden=false;card.scrollTop=0;card.style.animation="none";void card.offsetHeight;card.style.animation="";const x=card.querySelector(".x");x.onclick=close;x.focus({preventScroll:true})}
function close(){card.hidden=true;setFilter(null);if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
function setFilter(fn){svg.classList.toggle("filtering",!!fn);svg.querySelectorAll(".lm").forEach(g=>g.classList.toggle("lit",!!fn&&fn(P[+g.dataset.id])))}
const press=(e,fn)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}};
svg.querySelectorAll(".lm").forEach(g=>{const p=P[+g.dataset.id];
  g.addEventListener("click",()=>{if(!found.has(p.id)){discover(p.id);return}openPaper(p.id)});
  g.addEventListener("keydown",e=>press(e,()=>{if(!found.has(p.id))discover(p.id);else openPaper(p.id)}));
  g.addEventListener("focus",()=>{if(g.matches(":focus-visible"))discover(p.id)});
  g.addEventListener("pointerenter",e=>{if(e.pointerType==="touch"||!found.has(p.id))return;tip.innerHTML=`${esc(p.t)}<br><i>${p.y||"Undated"}${p.v?" · "+esc(p.v):""}</i>`;tip.hidden=false;moveTip(e)});
  g.addEventListener("pointermove",moveTip);g.addEventListener("pointerleave",()=>tip.hidden=true);});
function moveTip(e){if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px"}
// ---------- discovering the papers ----------
const KEY="realms-of-sameera-found";
const found=new Set();
try{(JSON.parse(localStorage.getItem(KEY)||"[]")).forEach(i=>{if(P[i])found.add(i)})}catch(e){}
const lmById={};svg.querySelectorAll(".lm").forEach(g=>lmById[+g.dataset.id]=g);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...found]))}catch(e){}}
function updateCount(){const n=found.size;document.getElementById("foundtxt").textContent=`${n} of ${P.length} papers found`;document.getElementById("foundfill").style.width=(n/P.length*100)+"%"}
function markFound(id){const g=lmById[id];g.classList.add("found");g.setAttribute("aria-label",`${P[id].t}, ${P[id].y||"undated"}`)}
let celebrated=false;
function discover(id,quiet){if(found.has(id))return;found.add(id);markFound(id);save();updateCount();
  if(!quiet){const g=lmById[id];g.classList.add("flash");setTimeout(()=>g.classList.remove("flash"),1400)}
  if(found.size===P.length&&!celebrated&&!quiet){celebrated=true;toast("Every paper found",`All ${WORDS(P.length)}, from the Shire to the beacons of Gondor.`)}}
function toast(head,body){const el=document.getElementById("toast");el.innerHTML=`<b>${esc(head)}</b>${esc(body)}`;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,7000)}
found.forEach(markFound);updateCount();
// the lantern: sweeping it over the land uncovers whatever lies close by
const lantern=document.getElementById("lantern");const pt=svg.createSVGPoint();let raf=0,last=null;
function toMap(e){pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function sweep(){raf=0;if(!last)return;const {x,y}=last;lantern.setAttribute("cx",x.toFixed(1));lantern.setAttribute("cy",y.toFixed(1));
  if(cam.classList.contains("revealing"))return;
  for(const p of P){if(found.has(p.id))continue;if((p.px-x)**2+(p.py-y)**2<38*38)discover(p.id)}}
svg.addEventListener("pointermove",e=>{last=toMap(e);lantern.setAttribute("opacity","1");if(!raf)raf=requestAnimationFrame(sweep)});
svg.addEventListener("pointerdown",e=>{last=toMap(e);lantern.setAttribute("opacity","1");sweep()});
svg.addEventListener("pointerleave",()=>lantern.setAttribute("opacity","0"));
document.getElementById("revealall").onclick=()=>{P.forEach(p=>discover(p.id,true));updateCount()};
document.getElementById("hideall").onclick=()=>{found.clear();save();celebrated=false;svg.querySelectorAll(".lm.found").forEach(g=>{g.classList.remove("found");g.setAttribute("aria-label","Hidden paper")});updateCount()};

svg.querySelectorAll(".rlabel").forEach(g=>{g.addEventListener("click",()=>openRealm(g.dataset.realm));g.addEventListener("keydown",e=>press(e,()=>openRealm(g.dataset.realm)))});

// ---------- the opening ----------
const intro=document.getElementById("intro"),linesEl=document.getElementById("lines"),road=document.getElementById("roadreveal");
const RL=Math.ceil(road.getTotalLength())+20;road.style.strokeDasharray=RL;road.style.strokeDashoffset=0;
const years=P.map(p=>p.y).filter(Boolean);
const SCRIPT=[
  [`In the year <span class="n">2014</span>, a young researcher set down his very first paper.`,4200],
  [`It was about badminton.`,3000],
  [`He did not yet know how far the road would carry him.`,3800],
  [`Over mountains of point clouds.`,2600],
  [`Through the golden wood of neural fields.`,2800],
  [`To beacons lit on a thousand GPUs.`,3000],
  [`<span class="n">${P.length}</span> papers. <span class="n">${Math.max(...years)-Math.min(...years)}</span> years. <span class="n">${DATA.ncoauth}</span> companions on the road.`,4000],
  [`This is the map of his journey.`,3400],
  [`<span class="t1">HAPPY BIRTHDAY</span><span class="t2">The Realms of Sameera</span><span class="t3">a map of everywhere you have been, so far</span>`,5200,"title"]
];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let run=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const stages=[...svg.querySelectorAll(".st")];
function finalState(){svg.style.transition="none";cam.classList.remove("revealing","zoomed");void svg.getBoundingClientRect();svg.style.transition="";stages.forEach(g=>g.classList.add("on"));road.style.transition="none";road.style.strokeDashoffset=0;intro.classList.add("gone");intro.hidden=true}
async function play(){
  const me=++run;card.hidden=true;setFilter(null);
  if(reduce){finalState();return}
  svg.style.transition="none";road.style.transition="none";
  cam.classList.add("revealing","zoomed");stages.forEach(g=>g.classList.remove("on"));
  road.style.strokeDashoffset=RL;void svg.getBoundingClientRect();svg.style.transition="";
  intro.hidden=false;intro.classList.remove("gone");linesEl.innerHTML="";
  document.getElementById("skip").focus({preventScroll:true});
  for(const [html,ms,cls] of SCRIPT){
    if(me!==run)return;
    const d=document.createElement("div");d.className="line"+(cls?" "+cls:"");d.innerHTML=html;linesEl.appendChild(d);
    void d.offsetWidth;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));d.classList.add("show");await wait(ms);if(me!==run)return;
    d.classList.remove("show");await wait(1150);d.remove();
  }
  if(me===run)reveal(me);
}
async function reveal(me){
  intro.classList.add("gone");
  svg.querySelector('[data-st="base"]').classList.add("on");svg.querySelector('[data-st="frame"]').classList.add("on");
  await wait(600);if(me!==run)return;
  road.style.transition="";road.style.strokeDashoffset=0;cam.classList.remove("zoomed");
  const T=10000;
  ORDER.forEach(([k,t])=>setTimeout(()=>{if(me===run)svg.querySelector(`[data-st="${k}"]`).classList.add("on")},t*T));
  await wait(2300);if(me!==run)return;intro.hidden=true;
  await wait(T);if(me===run)cam.classList.remove("revealing");
}
function skip(){run++;finalState()}
document.getElementById("skip").onclick=skip;
document.getElementById("replay").onclick=()=>play();
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!intro.hidden&&!intro.classList.contains("gone"))skip();else if(!card.hidden)close()});
play();
